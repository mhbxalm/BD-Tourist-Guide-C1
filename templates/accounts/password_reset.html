{% extends "base.html" %}
{% block title %}Reset password | BD Tourist Guide{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 520px"><div class="card-body p-4">
  <h1 class="h3">Reset your password</h1>
  <p class="text-secondary">Enter your verified account email. If it matches an account, we’ll send a reset link.</p>
  <form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_email">Email</label><input class="form-control" id="id_email" name="email" type="email" required></div><button class="btn btn-success w-100" type="submit">Send reset link</button></form>
</div></div>
{% endblock %}
