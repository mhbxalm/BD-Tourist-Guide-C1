{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BD Tourist Guide{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-success site-navbar">
    <div class="container"><a class="navbar-brand" href="/">BD Tourist Guide</a>
      <div class="navbar-nav ms-auto">
        {% if user.is_authenticated %}<a class="nav-link" href="{% url 'accounts:dashboard' %}">Dashboard</a><form method="post" action="{% url 'accounts:logout' %}" class="d-flex">{% csrf_token %}<button class="nav-link btn btn-link logout-button" type="submit">Log out</button></form>
        {% else %}<a class="nav-link" href="{% url 'accounts:login' %}">Log in</a><a class="nav-link" href="{% url 'accounts:register' %}">Register</a>{% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
